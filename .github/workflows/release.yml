name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build Windows installer and unpacked app
        run: |
          npm run build
          npx electron-builder --win --publish never

      - name: Archive portable zip from win-unpacked
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "dist/HighlightTranslator-Portable-v$ver-win64.zip" -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/HighlightTranslator-Setup-*.exe
            dist/HighlightTranslator-Setup-*.exe.blockmap
            dist/latest.yml
            dist/HighlightTranslator-Portable-*-win64.zip
